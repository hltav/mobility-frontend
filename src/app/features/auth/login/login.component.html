<app-auth-layout
  title="Bem-vinda de volta"
  description="Acesse sua conta para ver favoritos e histórico."
>
  <form class="surface auth-form" (ngSubmit)="onSubmit()" novalidate [attr.aria-busy]="isLoading()">
    @if (errorMessage()) {
      <p role="alert" class="auth-error">{{ errorMessage() }}</p>
    }
    <fieldset [disabled]="isLoading()" class="auth-fields">
      <div>
        <label for="login-email">E-mail</label>
        <input
          id="login-email"
          class="auth-input"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="username"
          inputmode="email"
          required
          maxlength="255"
          placeholder="seu@email.com"
          [attr.aria-invalid]="!!errors()['email']"
          aria-describedby="login-email-error"
        />
        <p id="login-email-error" class="field-error">{{ errors()['email'] }}</p>
      </div>
      <div>
        <label for="login-password">Senha</label>
        <input
          id="login-password"
          class="auth-input"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          minlength="6"
          maxlength="100"
          placeholder="Sua senha"
          [attr.aria-invalid]="!!errors()['password']"
          aria-describedby="login-password-error"
        />
        <p id="login-password-error" class="field-error">{{ errors()['password'] }}</p>
      </div>
      <button type="submit" class="button-primary w-full">
        {{ isLoading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </fieldset>
  </form>
  <p class="auth-footer">Não tem conta? <a routerLink="/register">Criar conta</a></p>
</app-auth-layout>
